name: visually_impaired_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_dotenv: ^5.0.2
  google_ml_kit: ^0.10.0
  http: ^0.13.3
  flutter_tts: ^3.2.2
  speech_to_text: ^6.6.1
  tflite: ^1.1.2
  camera: ^0.9.4+5
  permission_handler: ^10.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/splash/splash.png
    - assets/mobilenet_ssd.tflite
    - assets/labels.txt
